<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0f172a">
    <title>Workout Tracker</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/recharts@2.5.0/dist/Recharts.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
        }
    </style>
</head>
<body>
    <div id="root"></div>
    
    <script type="text/babel">
        const { useState, useEffect } = React;
        const { LineChart, Line, XAxis, YAxis, CartesianGrid, Tooltip, Legend, ResponsiveContainer } = Recharts;

        // Icons as SVG components
        const Plus = () => (
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
        );

        const TrendingUp = () => (
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <polyline points="23 6 13.5 15.5 8.5 10.5 1 18"></polyline>
                <polyline points="17 6 23 6 23 12"></polyline>
            </svg>
        );

        const Dumbbell = () => (
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M14.4 14.4L9.6 9.6"></path>
                <path d="M18.657 21.485a2 2 0 1 1-2.829-2.828l-1.767 1.768a2 2 0 1 1-2.829-2.829l6.364-6.364a2 2 0 1 1 2.829 2.829l-1.768 1.767a2 2 0 1 1 2.828 2.829z"></path>
                <path d="m21.5 21.5-1.4-1.4"></path>
                <path d="M3.9 3.9 2.5 2.5"></path>
                <path d="M6.404 12.768a2 2 0 1 1-2.829-2.829l1.768-1.767a2 2 0 1 1-2.828-2.829l2.828-2.828a2 2 0 1 1 2.829 2.828l1.767-1.768a2 2 0 1 1 2.829 2.829z"></path>
            </svg>
        );

        const Calendar = () => (
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                <line x1="16" y1="2" x2="16" y2="6"></line>
                <line x1="8" y1="2" x2="8" y2="6"></line>
                <line x1="3" y1="10" x2="21" y2="10"></line>
            </svg>
        );

        const Trash2 = () => (
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <polyline points="3 6 5 6 21 6"></polyline>
                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                <line x1="10" y1="11" x2="10" y2="17"></line>
                <line x1="14" y1="11" x2="14" y2="17"></line>
            </svg>
        );

        // Mock storage API using localStorage
        window.storage = {
            get: async (key) => {
                try {
                    const value = localStorage.getItem(key);
                    return value ? { key, value, shared: false } : null;
                } catch (error) {
                    return null;
                }
            },
            set: async (key, value) => {
                try {
                    localStorage.setItem(key, value);
                    return { key, value, shared: false };
                } catch (error) {
                    return null;
                }
            },
            delete: async (key) => {
                try {
                    localStorage.removeItem(key);
                    return { key, deleted: true, shared: false };
                } catch (error) {
                    return null;
                }
            }
        };

        function WorkoutTracker() {
            const [workouts, setWorkouts] = useState([]);
            const [currentWorkout, setCurrentWorkout] = useState([]);
            const [exerciseName, setExerciseName] = useState('');
            const [sets, setSets] = useState('');
            const [reps, setReps] = useState('');
            const [weight, setWeight] = useState('');
            const [view, setView] = useState('log');

            useEffect(() => {
                const loadData = async () => {
                    try {
                        const result = await window.storage.get('workouts');
                        if (result && result.value) {
                            setWorkouts(JSON.parse(result.value));
                        }
                    } catch (error) {
                        console.log('No previous workouts found');
                    }
                };
                loadData();
            }, []);

            useEffect(() => {
                if (workouts.length > 0) {
                    window.storage.set('workouts', JSON.stringify(workouts));
                }
            }, [workouts]);

            const addExerciseToWorkout = () => {
                if (!exerciseName || !sets || !reps) return;

                const exercise = {
                    name: exerciseName.trim(),
                    sets: parseInt(sets),
                    reps: parseInt(reps),
                    weight: weight ? parseFloat(weight) : 0,
                    id: Date.now()
                };

                setCurrentWorkout([...currentWorkout, exercise]);
                setExerciseName('');
                setSets('');
                setReps('');
                setWeight('');
            };

            const removeExerciseFromWorkout = (id) => {
                setCurrentWorkout(currentWorkout.filter(ex => ex.id !== id));
            };

            const saveWorkout = () => {
                if (currentWorkout.length === 0) return;

                const workout = {
                    date: new Date().toISOString(),
                    exercises: currentWorkout,
                    id: Date.now()
                };

                setWorkouts([workout, ...workouts]);
                setCurrentWorkout([]);
            };

            const deleteWorkout = (id) => {
                setWorkouts(workouts.filter(w => w.id !== id));
            };

            const getLastPerformance = (exerciseName) => {
                const normalizedName = exerciseName.trim().toLowerCase();
                for (let workout of workouts) {
                    const exercise = workout.exercises.find(
                        ex => ex.name.toLowerCase() === normalizedName
                    );
                    if (exercise) {
                        return {
                            ...exercise,
                            date: new Date(workout.date).toLocaleDateString()
                        };
                    }
                }
                return null;
            };

            const getProgressData = (exerciseName) => {
                const normalizedName = exerciseName.toLowerCase();
                const data = [];
                
                [...workouts].reverse().forEach(workout => {
                    const exercise = workout.exercises.find(
                        ex => ex.name.toLowerCase() === normalizedName
                    );
                    if (exercise) {
                        data.push({
                            date: new Date(workout.date).toLocaleDateString('en-US', { month: 'short', day: 'numeric' }),
                            volume: exercise.sets * exercise.reps * (exercise.weight || 1),
                            weight: exercise.weight,
                            reps: exercise.reps,
                            sets: exercise.sets
                        });
                    }
                });
                
                return data;
            };

            const getAllExerciseNames = () => {
                const names = new Set();
                workouts.forEach(workout => {
                    workout.exercises.forEach(ex => {
                        names.add(ex.name);
                    });
                });
                return Array.from(names).sort();
            };

            const lastPerformance = exerciseName ? getLastPerformance(exerciseName) : null;

            return (
                <div className="min-h-screen bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900 text-white p-4">
                    <div className="max-w-4xl mx-auto">
                        <div className="mb-8 text-center">
                            <div className="flex items-center justify-center gap-3 mb-2">
                                <div className="text-blue-400"><Dumbbell /></div>
                                <h1 className="text-4xl font-bold bg-gradient-to-r from-blue-400 to-purple-500 bg-clip-text text-transparent">
                                    Workout Tracker
                                </h1>
                            </div>
                            <p className="text-slate-400">Track your progress, beat your PRs</p>
                        </div>

                        <div className="flex gap-2 mb-6 bg-slate-800 p-1 rounded-lg">
                            <button
                                onClick={() => setView('log')}
                                className={`flex-1 py-3 px-4 rounded-md font-medium transition-all ${
                                    view === 'log'
                                        ? 'bg-blue-500 text-white shadow-lg'
                                        : 'text-slate-400 hover:text-white'
                                }`}
                            >
                                <span className="inline-block mr-2"><Calendar /></span>
                                Log Workout
                            </button>
                            <button
                                onClick={() => setView('progress')}
                                className={`flex-1 py-3 px-4 rounded-md font-medium transition-all ${
                                    view === 'progress'
                                        ? 'bg-blue-500 text-white shadow-lg'
                                        : 'text-slate-400 hover:text-white'
                                }`}
                            >
                                <span className="inline-block mr-2"><TrendingUp /></span>
                                Progress
                            </button>
                        </div>

                        {view === 'log' ? (
                            <div className="space-y-6">
                                <div className="bg-slate-800 rounded-xl p-6 shadow-xl border border-slate-700">
                                    <h2 className="text-xl font-bold mb-4 text-blue-400">Add Exercise</h2>
                                    
                                    {lastPerformance && (
                                        <div className="mb-4 p-3 bg-slate-700 rounded-lg border border-blue-500/30">
                                            <p className="text-sm text-slate-300">
                                                Last time: <span className="font-semibold text-blue-400">{lastPerformance.sets} sets × {lastPerformance.reps} reps</span>
                                                {lastPerformance.weight > 0 && <span className="text-blue-400"> @ {lastPerformance.weight} lbs</span>}
                                                <span className="text-slate-500 ml-2">({lastPerformance.date})</span>
                                            </p>
                                        </div>
                                    )}

                                    <div className="grid gap-4">
                                        <input
                                            type="text"
                                            placeholder="Exercise name (e.g., Bench Press)"
                                            value={exerciseName}
                                            onChange={(e) => setExerciseName(e.target.value)}
                                            className="w-full px-4 py-3 bg-slate-700 rounded-lg border border-slate-600 focus:border-blue-500 focus:outline-none text-white"
                                            list="exercise-list"
                                        />
                                        <datalist id="exercise-list">
                                            {getAllExerciseNames().map(name => (
                                                <option key={name} value={name} />
                                            ))}
                                        </datalist>

                                        <div className="grid grid-cols-3 gap-3">
                                            <input
                                                type="number"
                                                placeholder="Sets"
                                                value={sets}
                                                onChange={(e) => setSets(e.target.value)}
                                                className="px-4 py-3 bg-slate-700 rounded-lg border border-slate-600 focus:border-blue-500 focus:outline-none text-white"
                                            />
                                            <input
                                                type="number"
                                                placeholder="Reps"
                                                value={reps}
                                                onChange={(e) => setReps(e.target.value)}
                                                className="px-4 py-3 bg-slate-700 rounded-lg border border-slate-600 focus:border-blue-500 focus:outline-none text-white"
                                            />
                                            <input
                                                type="number"
                                                placeholder="Weight (lbs)"
                                                value={weight}
                                                onChange={(e) => setWeight(e.target.value)}
                                                className="px-4 py-3 bg-slate-700 rounded-lg border border-slate-600 focus:border-blue-500 focus:outline-none text-white"
                                            />
                                        </div>

                                        <button
                                            onClick={addExerciseToWorkout}
                                            className="w-full bg-blue-500 hover:bg-blue-600 py-3 rounded-lg font-semibold transition-colors flex items-center justify-center gap-2"
                                        >
                                            <Plus />
                                            Add Exercise
                                        </button>
                                    </div>
                                </div>

                                {currentWorkout.length > 0 && (
                                    <div className="bg-slate-800 rounded-xl p-6 shadow-xl border border-slate-700">
                                        <h2 className="text-xl font-bold mb-4 text-blue-400">Today's Workout</h2>
                                        <div className="space-y-3">
                                            {currentWorkout.map((exercise) => (
                                                <div key={exercise.id} className="flex items-center justify-between p-4 bg-slate-700 rounded-lg">
                                                    <div>
                                                        <p className="font-semibold">{exercise.name}</p>
                                                        <p className="text-sm text-slate-400">
                                                            {exercise.sets} sets × {exercise.reps} reps
                                                            {exercise.weight > 0 && ` @ ${exercise.weight} lbs`}
                                                        </p>
                                                    </div>
                                                    <button
                                                        onClick={() => removeExerciseFromWorkout(exercise.id)}
                                                        className="text-red-400 hover:text-red-300 p-2"
                                                    >
                                                        <Trash2 />
                                                    </button>
                                                </div>
                                            ))}
                                        </div>
                                        <button
                                            onClick={saveWorkout}
                                            className="w-full mt-4 bg-green-500 hover:bg-green-600 py-3 rounded-lg font-semibold transition-colors"
                                        >
                                            Save Workout
                                        </button>
                                    </div>
                                )}

                                <div className="bg-slate-800 rounded-xl p-6 shadow-xl border border-slate-700">
                                    <h2 className="text-xl font-bold mb-4 text-blue-400">Recent Workouts</h2>
                                    {workouts.length === 0 ? (
                                        <p className="text-slate-400 text-center py-8">No workouts logged yet. Start your first workout above!</p>
                                    ) : (
                                        <div className="space-y-4">
                                            {workouts.slice(0, 5).map((workout) => (
                                                <div key={workout.id} className="p-4 bg-slate-700 rounded-lg">
                                                    <div className="flex items-center justify-between mb-3">
                                                        <p className="font-semibold text-blue-400">
                                                            {new Date(workout.date).toLocaleDateString('en-US', { 
                                                                weekday: 'short', 
                                                                month: 'short', 
                                                                day: 'numeric',
                                                                year: 'numeric'
                                                            })}
                                                        </p>
                                                        <button
                                                            onClick={() => deleteWorkout(workout.id)}
                                                            className="text-red-400 hover:text-red-300 p-1"
                                                        >
                                                            <Trash2 />
                                                        </button>
                                                    </div>
                                                    <div className="space-y-2">
                                                        {workout.exercises.map((exercise, idx) => (
                                                            <p key={idx} className="text-sm text-slate-300">
                                                                • {exercise.name}: {exercise.sets}×{exercise.reps}
                                                                {exercise.weight > 0 && ` @ ${exercise.weight} lbs`}
                                                            </p>
                                                        ))}
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                </div>
                            </div>
                        ) : (
                            <div className="space-y-6">
                                <div className="bg-slate-800 rounded-xl p-6 shadow-xl border border-slate-700">
                                    <h2 className="text-xl font-bold mb-4 text-blue-400">Exercise Progress</h2>
                                    {getAllExerciseNames().length === 0 ? (
                                        <p className="text-slate-400 text-center py-8">Log some workouts to see your progress!</p>
                                    ) : (
                                        <div className="space-y-8">
                                            {getAllExerciseNames().map(exerciseName => {
                                                const data = getProgressData(exerciseName);
                                                if (data.length < 2) return null;
                                                
                                                return (
                                                    <div key={exerciseName} className="p-4 bg-slate-700 rounded-lg">
                                                        <h3 className="font-semibold text-lg mb-4">{exerciseName}</h3>
                                                        <ResponsiveContainer width="100%" height={200}>
                                                            <LineChart data={data}>
                                                                <CartesianGrid strokeDasharray="3 3" stroke="#374151" />
                                                                <XAxis dataKey="date" stroke="#9ca3af" />
                                                                <YAxis stroke="#9ca3af" />
                                                                <Tooltip 
                                                                    contentStyle={{ 
                                                                        backgroundColor: '#1e293b', 
                                                                        border: '1px solid #475569',
                                                                        borderRadius: '8px'
                                                                    }}
                                                                />
                                                                <Legend />
                                                                <Line 
                                                                    type="monotone" 
                                                                    dataKey="volume" 
                                                                    stroke="#3b82f6" 
                                                                    strokeWidth={2}
                                                                    name="Total Volume"
                                                                />
                                                                {data[0].weight > 0 && (
                                                                    <Line 
                                                                        type="monotone" 
                                                                        dataKey="weight" 
                                                                        stroke="#8b5cf6" 
                                                                        strokeWidth={2}
                                                                        name="Weight (lbs)"
                                                                    />
                                                                )}
                                                            </LineChart>
                                                        </ResponsiveContainer>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<WorkoutTracker />);
    </script>
</body>
</html>
